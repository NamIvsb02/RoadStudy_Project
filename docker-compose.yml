services:
  backend:
    build: ./BE_RStudy
    container_name: roadstudy-backend
    env_file: ./BE_RStudy/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      # Giữ file upload (avatar, bìa, tài liệu, minh chứng) trên máy, không mất khi xóa container
      - ./BE_RStudy/uploads:/app/uploads
    restart: unless-stopped

  # Redis (cache và bộ đếm rate limit dùng chung). Không bật mặc định: chạy `docker compose --profile redis up -d`,
  # đặt REDIS_PASSWORD (shell hoặc file .env ở thư mục gốc) và đặt REDIS_URL=redis://:<mật khẩu>@redis:6379 trong BE_RStudy/.env.
  # Không publish cổng ra máy chủ, chỉ backend trong cùng mạng Docker kết nối được.
  redis:
    image: redis:7-alpine
    container_name: roadstudy-redis
    profiles: ["redis"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - 'test -n "$$REDIS_PASSWORD" || { echo "Thiếu REDIS_PASSWORD" >&2; exit 1; }; exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy volatile-lru --save "" --appendonly no'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./FE_RStudy
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_ASSET_URL: http://localhost:5000
    container_name: roadstudy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
