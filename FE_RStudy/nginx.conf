server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: mọi đường dẫn không phải file đều trả về index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # File đã build có hash trong tên, cache lâu được
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
