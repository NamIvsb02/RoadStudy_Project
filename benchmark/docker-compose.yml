# Môi trường đo hiệu năng CÔ LẬP: Postgres local + backend, không dùng DB Supabase, Cloudinary hay Gemini.
# Chạy qua benchmark/run.sh (không chạy trực tiếp). Mọi biến lấy từ benchmark/bench.env, KHÔNG đọc BE_RStudy/.env.
name: roadstudy-bench

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
      # Độ trễ mô phỏng giữa backend và DB (ms). DB Supabase thật đo được ~165ms mỗi truy vấn.
      DB_LATENCY_MS: ${DB_LATENCY_MS:-160}
    cap_add:
      - NET_ADMIN # để chạy tc netem (chỉ trong container db của môi trường đo)
    entrypoint: ["/bin/sh", "/db-entrypoint.sh"]
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=200"]
    volumes:
      - ./db-entrypoint.sh:/db-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redis của môi trường đo (mật khẩu cố định, chỉ nằm trong mạng Docker của benchmark). Backend chỉ dùng khi REDIS_URL có giá trị.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "bench", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a bench --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ../BE_RStudy
    image: roadstudy-bench-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Giới hạn tài nguyên giống một server nhỏ để số đo CPU/RAM có ý nghĩa
    cpus: 1.0
    mem_limit: 512m
    ports:
      - "127.0.0.1:5057:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://bench:bench@db:5432/bench
      DIRECT_URL: postgresql://bench:bench@db:5432/bench
      JWT_ACCESS_SECRET: bench-access-secret
      JWT_REFRESH_SECRET: bench-refresh-secret
      STORAGE_DRIVER: local
      CORS_ORIGIN: http://localhost:5173
      # Chỉ có tác dụng sau giai đoạn 1 (code mới đọc các biến này); để trống thì dùng mặc định của Prisma
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-}
      # Để trống = tắt Redis (cache và rate limit trong RAM). Bật: REDIS_URL=redis://:bench@redis:6379 benchmark/run.sh <nhãn> ...
      REDIS_URL: ${REDIS_URL:-}
      REDIS_KEY_ENV: bench
